name: release

# Push a tag like v1.0.0 to build the core and publish a release.
# The installer always downloads .../releases/latest/download/mdt-linux-<arch>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: |
          go mod tidy
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$ver" \
              -o dist/mdt-linux-$arch ./cmd/mdt
          done
          cd dist && sha256sum mdt-linux-* > SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
