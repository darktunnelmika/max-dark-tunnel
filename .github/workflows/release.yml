name: release

# Publish a GitHub Release (e.g. tag v1.0.0) and this attaches the core
# binaries to it. The installer downloads .../releases/latest/download/mdt-linux-<arch>.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: |
          go mod tidy
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$ver" \
              -o dist/mdt-linux-$arch ./cmd/mdt
          done
          cd dist && sha256sum mdt-linux-* > SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event.release.tag_name }}
