name: release

# Every push to main builds the core and publishes it as the release
# v<SCRIPT_VER> (the version in max-dark-tunnel.sh), so the installer's
# .../releases/latest/download/mdt-linux-<arch> always has a binary.
on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "go.mod", "max-dark-tunnel.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        id: build
        run: |
          ver="$(grep -m1 '^SCRIPT_VER=' max-dark-tunnel.sh | cut -d'"' -f2)"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          go mod tidy
          go vet ./...
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$ver" \
              -o dist/mdt-linux-$arch ./cmd/mdt
          done
          cp max-dark-tunnel.sh install.sh dist/
          cd dist && sha256sum mdt-linux-* max-dark-tunnel.sh install.sh > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.ver }}
          name: Max Dark Tunnel v${{ steps.build.outputs.ver }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
